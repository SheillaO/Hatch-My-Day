<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hatch</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="index.css">
</head>

<body>
	<h1 id="title">🥚 Hatch</h1>
	<h4 id="idea">Answer three questions. Get your day.</h4>

	<div class="question">
		<p class="label">How's your energy right now?</p>
		<div class="options">
			<label>
				<input type="radio" name="energy" value="low">
				<span>😴 Low</span>
			</label>
			<label>
				<input type="radio" name="energy" value="medium" checked>
				<span>🙂 Medium</span>
			</label>
			<label>
				<input type="radio" name="energy" value="high">
				<span>⚡ High</span>
			</label>
		</div>
	</div>

	
	<div class="question">
		<p class="label">Who are you with?</p>
		<div class="options">
			<label>
				<input type="radio" name="social" value="1" checked>
				<span>🧍 Just me</span>
			</label>
			<label>
				<input type="radio" name="social" value="2">
				<span>👥 With others</span>
			</label>
		</div>
	</div>

	
	<div class="question">
		<p class="label">How many free hours do you have?</p>
		<input type="number" id="hours" min="1" max="12" value="6">
	</div>

	<button id="bored-bot">Hatch My Day 🥚</button>

	
	<div id="blueprint">

	
		<canvas id="dotlottie-canvas"></canvas>

		<div class="card" id="morning-card">
			<p class="time">🌅 Morning</p>
			<p class="activity" id="morning-activity">Finding something for you...</p>
		</div>
		<div class="card" id="afternoon-card">
			<p class="time">☀️ Afternoon</p>
			<p class="activity" id="afternoon-activity">Finding something for you...</p>
		</div>
		<div class="card" id="evening-card">
			<p class="time">🌙 Evening</p>
			<p class="activity" id="evening-activity">Finding something for you...</p>
		</div>
	</div>

	<script src="index.js"></script>

	
	<script type="module">
		import { DotLottie } from "https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-web/+esm";

		new DotLottie({
			autoplay: true,
			loop: true,
			canvas: document.getElementById("dotlottie-canvas"),
			src: "https://lottie.host/226ae262-bca4-417e-8e24-dedf9639e149/ANPBxEbrSU.lottie" // 👈 
		});
	</script>
</body>

</html>
